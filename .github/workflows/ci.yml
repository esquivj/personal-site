name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser
        run: npx playwright install --with-deps chromium --only-shell
      - name: Verify interactive travel map
        run: npm run test:browser
      - name: Save map screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-map-screenshots
          path: test-results/travel-map/
          if-no-files-found: ignore
